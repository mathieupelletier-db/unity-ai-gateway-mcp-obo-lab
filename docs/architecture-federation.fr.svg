<text x="594.3" y="253.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="middle">① échange du jeton Entra</text>
<text x="40" y="1111" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">Fédération de jetons : le back-end échange le jeton Entra de l&#x27;utilisateur (émis pour sa propre API) contre un jeton Databricks.</text>
<text x="40" y="1127" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">Une politique de fédération du compte associe ce jeton à l&#x27;utilisateur Databricks. Aucun OBO vers Azure Databricks ni secret Databricks pour les appels de l&#x27;utilisateur.</text>
<text x="40" y="1143" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">Chaque appel d&#x27;outil passe toujours par Unity AI Gateway au nom de cet utilisateur, et chaque serveur MCP reçoit le jeton propre à l&#x27;utilisateur. Le modèle est appelé</text>
<text x="40" y="1159" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">sous l&#x27;identité de l&#x27;application. Labo : échange et appels validés avec une politique pour l&#x27;audience Azure Databricks; audience = API back-end pas encore testée.</text>
<text x="40" y="1175" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">Pointillés : Copilot Studio (pas encore validé), l&#x27;autre chemin vers le serveur MCP par l&#x27;Application Gateway (validé), et la connexion OAuth et l&#x27;actualisation</text>
<text x="40" y="1191" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">des jetons, qui vont directement de Databricks à Atlassian.</text>
