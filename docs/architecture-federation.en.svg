<text x="594.3" y="253.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="middle">① exchange Entra token</text>
<text x="40" y="1111" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">Token federation: the agent backend exchanges the user&#x27;s Entra token (issued for its own API) for a Databricks token. An account federation policy maps it</text>
<text x="40" y="1127" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">to the Databricks user. No OBO to Azure Databricks and no Databricks secret for user calls.</text>
<text x="40" y="1143" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">Every tool call still goes through Unity AI Gateway as that user, and each MCP server still receives the user&#x27;s own token. The model is called under the app identity.</text>
<text x="40" y="1159" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">Lab status: exchange and gateway calls validated with a policy for the Azure Databricks audience; a policy for the backend&#x27;s own API audience is not yet tested.</text>
<text x="40" y="1175" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">Dashed: Copilot Studio (not yet validated), the alternative route to the MCP server through the Application Gateway (validated), and OAuth sign-in and token</text>
<text x="40" y="1191" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">refresh, which go from Databricks directly to Atlassian.</text>
