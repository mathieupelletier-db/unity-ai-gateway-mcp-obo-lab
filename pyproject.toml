[project]
name = "mcp-obo-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
  "msal>=1.28",
  "uvicorn>=0.30",
  "starlette>=0.37",
  "fastapi>=0.115",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "cryptography>=42"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["live: hits real Azure/Databricks endpoints"]
addopts = "-m 'not live'"
